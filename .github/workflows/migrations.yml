name: 'Database Migrations'

on:
  workflow_run:
    workflows: ["Terraform CI/CD"]
    types:
      - completed

jobs:
  migrate:
    name: 'Alembic Upgrade'
    runs-on: ubuntu-latest
    # Only run if the Terraform workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: 'condo-infraction-system-492221'
          workload_identity_provider: 'projects/1090801247281/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform-cicd@condo-infraction-system-492221.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Install Cloud SQL Auth Proxy'
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: 'Start Cloud SQL Auth Proxy'
        run: |
          ./cloud-sql-proxy condo-infraction-system-492221:southamerica-west1:condo-db-instance --port 5432 &
          sleep 10

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Install Dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 'Fetch DB Password from Secret Manager'
        id: 'secrets'
        uses: 'google-github-actions/get-secretmanager-secrets@v2'
        with:
          secrets: |-
            DB_PASS:condo-infraction-system-492221/condo-infraction-system-db-password

      - name: 'Run Alembic Migrations'
        env:
          DB_USER: 'ai_backend_user'
          DB_PASS: ${{ steps.secrets.outputs.DB_PASS }}
          DB_NAME: 'infractions'
          DB_HOST: '127.0.0.1'
          DB_PORT: '5432'
        run: |
          cd backend
          alembic upgrade head
